version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: spendsense-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: spendsense
      POSTGRES_USER: spendsense
      POSTGRES_PASSWORD: spendsense
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendsense -d spendsense"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spendsense

  backend:
    build: ./backend
    container_name: spendsense-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://spendsense:spendsense@postgres:5432/spendsense?sslmode=disable
      - JWT_SECRET=spendsense_secret_2026
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spendsense

  frontend:
    build: ./frontend
    container_name: spendsense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - spendsense

volumes:
  pg_data:

networks:
  spendsense:
    driver: bridge
